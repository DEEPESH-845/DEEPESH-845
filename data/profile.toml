hot = 4
stages = [
  ["PHONE SCAN", "3D capture"],
  ["DIGITAL TWIN", "Unity"],
  ["PPO POLICY", "ML-Agents"],
  ["ONNX · INT8", "Qualcomm AI Hub"],
  ["HEXAGON NPU", "Arduino UNO Q"],
  ["ROBOT", "STM32 · e-stop"],
]

[system.behaviordna]
hot = 4
stages = [
  ["KEYSTROKES", "40+ signals / 500 ms"],
  ["FASTAPI ENGINE", "every login"],
  ["3 PATHWAYS", "device · coercion · ML"],
  ["RISK 0–1000", "3 decision bands"],
  ["DECISION", "~14 ms vs 150 ms SLA"],
  ["CASE REPORT", "LangGraph, hard blocks"],
]

[system.zerocloud]
hot = 5
