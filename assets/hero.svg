<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Deepesh Kakkar — I build systems whose numbers you can check.">
  <title>Deepesh Kakkar — software and AI systems engineer</title>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.032" stroke-width="1"/>
    </pattern>
    <linearGradient id="vig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0C10" stop-opacity="0"/>
      <stop offset="62%" stop-color="#0A0C10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0C10" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0A0C10"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- instrument reticle -->
    <g transform="translate(1004 170)">
      <circle r="112" fill="none" stroke="#1E242E" stroke-width="1"/>
      <circle r="78" fill="none" stroke="#FF7A1A" stroke-opacity="0.22" stroke-width="1"/>
      <circle r="44" fill="none" stroke="#1E242E" stroke-width="1"/>
      <line x1="-128" y1="0" x2="128" y2="0" stroke="#1E242E" stroke-width="1"/>
      <line x1="0" y1="-128" x2="0" y2="128" stroke="#1E242E" stroke-width="1"/>
      <g stroke="#3A4351" stroke-width="1">
        <line x1="0" y1="-112" x2="0" y2="-100"/><line x1="0" y1="112" x2="0" y2="100"/>
        <line x1="-112" y1="0" x2="-100" y2="0"/><line x1="112" y1="0" x2="100" y2="0"/>
        <line x1="79" y1="-79" x2="71" y2="-71"/><line x1="-79" y1="79" x2="-71" y2="71"/>
        <line x1="-79" y1="-79" x2="-71" y2="-71"/><line x1="79" y1="79" x2="71" y2="71"/>
      </g>
      <g>
        <rect x="0" y="-2" width="112" height="4" fill="url(#sweep)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </g>
      <circle cx="52" cy="-34" r="3" fill="#FF7A1A"/>
      <circle cx="-38" cy="60" r="2.5" fill="#FF7A1A" fill-opacity="0.7"/>
      <circle cx="-64" cy="-46" r="2" fill="#FF7A1A" fill-opacity="0.5"/>
      <text x="0" y="7" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" letter-spacing="3" fill="#E7ECF3" fill-opacity="0.92">DK</text>
    </g>

    <!-- status -->
    <g transform="translate(80 60)">
      <circle cx="0" cy="-4" r="3.5" fill="#FF7A1A">
        <animate attributeName="fill-opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="16" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.6" fill="#7D8797">CURRENTLY BUILDING — KAVACH · ZEROCLOUD</text>
    </g>

    <!-- identity -->
    <text x="80" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="3.4" fill="#5D6675">BACKEND · AI SYSTEMS · THAPAR INSTITUTE ’27</text>
    <text x="78" y="196" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-1.4" fill="#EDF1F7">DEEPESH KAKKAR</text>
    <rect x="80" y="224" width="54" height="2" fill="#FF7A1A"/>
    <text x="80" y="264" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="23" fill="#B7C0CD">I build systems whose numbers you can check.</text>
    <text x="80" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#5D6675">PREVIOUSLY — QUALCOMM · HALLIBURTON · OUTLIER.AI</text>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#242B36" stroke-width="1"/>
  </g>
</svg>
