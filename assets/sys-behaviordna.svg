<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" width="720" height="248" role="img" aria-label="Behaviordna pipeline: KEYSTROKES (40+ signals / 500 ms), then FASTAPI ENGINE (every login), then 3 PATHWAYS (device · coercion · ML), then RISK 0–1000 (3 decision bands), then DECISION (~14 ms vs 150 ms SLA), then CASE REPORT (LangGraph, hard blocks)."><title>Behaviordna pipeline: KEYSTROKES (40+ signals / 500 ms), then FASTAPI ENGINE (every login), then 3 PATHWAYS (device · coercion · ML), then RISK 0–1000 (3 decision bands), then DECISION (~14 ms vs 150 ms SLA), then CASE REPORT (LangGraph, hard blocks).</title><style>
