<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="How I work: claim, then measure, then compare against a baseline, then ship. If it does not beat the baseline, it is not done.">
  <title>The loop: CLAIM to MEASURE to BASELINE to SHIP, with a feedback return path</title>
  <defs>
    <clipPath id="c2"><rect width="1200" height="260" rx="16"/></clipPath>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3A4351"/>
    </marker>
    <path id="track" d="M232 96 H352 M496 96 H616 M760 96 H880 M1024 116 V170 H176 V116" fill="none"/>
  </defs>

  <g clip-path="url(#c2)">
    <rect width="1200" height="260" fill="#0A0C10"/>
    <text x="80" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="3.2" fill="#5D6675">THE LOOP</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
      <g>
        <rect x="80" y="70" width="152" height="52" rx="10" fill="#111419" stroke="#242B36"/>
        <text x="156" y="102" font-size="14" letter-spacing="2.4" fill="#E7ECF3">CLAIM</text>
      </g>
      <g>
        <rect x="352" y="70" width="152" height="52" rx="10" fill="#111419" stroke="#242B36"/>
        <text x="428" y="102" font-size="14" letter-spacing="2.4" fill="#E7ECF3">MEASURE</text>
      </g>
      <g>
        <rect x="616" y="70" width="152" height="52" rx="10" fill="#111419" stroke="#242B36"/>
        <text x="692" y="102" font-size="14" letter-spacing="2.4" fill="#E7ECF3">BASELINE</text>
      </g>
      <g>
        <rect x="880" y="70" width="152" height="52" rx="10" fill="#17110B" stroke="#FF7A1A" stroke-opacity="0.45"/>
        <text x="956" y="102" font-size="14" letter-spacing="2.4" fill="#FF9D4D">SHIP</text>
      </g>
    </g>

    <g stroke="#3A4351" stroke-width="1.4" fill="none" marker-end="url(#arw)">
      <line x1="240" y1="96" x2="344" y2="96"/>
      <line x1="512" y1="96" x2="608" y2="96"/>
      <line x1="776" y1="96" x2="872" y2="96"/>
    </g>

    <path d="M1024 122 V170 H176 V130" fill="none" stroke="#3A4351" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#arw)"/>

    <circle r="4" fill="#FF7A1A">
      <animateMotion dur="7s" repeatCount="indefinite" path="M1024 122 V170 H156 V122"/>
      <animate attributeName="fill-opacity" values="0.15;1;0.15" dur="7s" repeatCount="indefinite"/>
    </circle>

    <text x="600" y="204" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#B7C0CD">If it doesn’t beat the dumbest baseline that would have worked, it isn’t done.</text>
    <text x="600" y="230" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2" fill="#5D6675">A FIELD IS EITHER BACKED BY EVIDENCE OR IT IS ABSENT</text>

    <rect x="0.5" y="0.5" width="1199" height="259" rx="16" fill="none" stroke="#242B36"/>
  </g>
</svg>
