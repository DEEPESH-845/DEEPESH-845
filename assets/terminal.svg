        <text x="40" y="254"><tspan fill="#FF7A1A">$</tspan><tspan fill="#E7ECF3" dx="10">head -1 principles.txt</tspan></text></g>
      <g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8043;0.8587;1" dur="4.6s" fill="freeze"/>
        <text x="40" y="278" fill="#8B95A5">“a number without a source is not a number.”</text>
        <rect x="452" y="266" width="9" height="16" fill="#FF7A1A">
