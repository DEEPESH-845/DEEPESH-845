<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Terminal: whoami returns Deepesh, software and AI systems engineer. Active work: Kavach, a merchant trust layer for agentic commerce, and ZeroCloud, local LLM capability prediction in Rust.">
  <title>Current status terminal</title>
  <defs><clipPath id="c3"><rect width="1200" height="300" rx="16"/></clipPath></defs>
