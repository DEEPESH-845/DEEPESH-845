        <text x="40" y="118" fill="#8B95A5">deepesh — backend &amp; AI systems engineer</text></g>

      <g opacity="1"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3261;0.3804;1" dur="4.6s" fill="freeze"/>
