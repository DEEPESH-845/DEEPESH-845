<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" width="720" height="248" role="img" aria-label="Zerocloud pipeline: RAM BANDWIDTH (STREAM triad), then DISK (the model's own volume), then COMPUTE (f32 · int8 GEMM), then MEMORY-BOUND (η × bandwidth / bytes), then PREDICTION (tok/s · context · TTFT), then ZC GATE (9.4% median error)."><title>Zerocloud pipeline: RAM BANDWIDTH (STREAM triad), then DISK (the model's own volume), then COMPUTE (f32 · int8 GEMM), then MEMORY-BOUND (η × bandwidth / bytes), then PREDICTION (tok/s · context · TTFT), then ZC GATE (9.4% median error).</title><style>
.s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.p{stroke-dasharray:.035 1.2;stroke-dashoffset:.035;animation:run var(--d,5s) linear infinite var(--o,0s)}
.b{animation:blink 2.4s ease-in-out infinite}
