<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Make it real, then make it checkable. Deepesh Kakkar.">
  <title>Closing frame</title>
  <defs>
    <clipPath id="c5"><rect width="1200" height="180" rx="16"/></clipPath>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF7A1A" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c5)">
    <rect width="1200" height="180" fill="#0A0C10"/>
    <rect x="200" y="0" width="800" height="2" fill="url(#hair)"/>

    <g transform="translate(600 74)">
      <circle r="30" fill="none" stroke="#242B36"/>
      <circle r="19" fill="none" stroke="#FF7A1A" stroke-opacity="0.3"/>
      <line x1="-38" y1="0" x2="-32" y2="0" stroke="#3A4351"/>
      <line x1="38" y1="0" x2="32" y2="0" stroke="#3A4351"/>
      <line x1="0" y1="-38" x2="0" y2="-32" stroke="#3A4351"/>
      <line x1="0" y1="38" x2="0" y2="32" stroke="#3A4351"/>
      <circle r="3" fill="#FF7A1A">
        <animate attributeName="fill-opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="600" y="140" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="0.5" fill="#E7ECF3">Make it real. Then make it checkable.</text>
    <rect x="0.5" y="0.5" width="1199" height="179" rx="16" fill="none" stroke="#242B36"/>
  </g>
</svg>
